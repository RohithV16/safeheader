name: Release Chrome Extension

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (optional; defaults to v<package.json version>)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build and package Chrome extension
        run: npm run package

      - name: Resolve release tag
        id: meta
        shell: bash
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          EXPECTED_TAG="v${PKG_VERSION}"

          if [[ "${{ github.event_name }}" == "push" ]]; then
            TAG="${GITHUB_REF_NAME}"
            if [[ "${TAG}" != "${EXPECTED_TAG}" ]]; then
              echo "Tag ${TAG} does not match package.json/manifest.json version (${EXPECTED_TAG})." >&2
              exit 1
            fi
          else
            INPUT_TAG="${{ inputs.tag }}"
            TAG="${INPUT_TAG:-$EXPECTED_TAG}"
          fi

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${PKG_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: SafeHeader ${{ steps.meta.outputs.tag }}
          generate_release_notes: true
          files: |
            release/safeheader-v*.zip
            release/SHA256SUMS.txt
          body: |
            ## Install in Chrome
            1. Download `safeheader-v${{ steps.meta.outputs.version }}.zip` from the **Assets** below and unzip it into a folder.
            2. Open `chrome://extensions` in Chrome and enable **Developer mode** (top right).
            3. Click **Load unpacked** and select the unzipped folder (it contains `manifest.json` at the root).
