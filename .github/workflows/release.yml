name: Release Chrome Extension

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Bump version and update manifest
        id: bump
        shell: bash
        run: |
          npm version "${{ inputs.bump }}" --no-git-tag-version
          NEW_VERSION=$(node -p "require('./package.json').version")
          node -e '
            const fs = require("node:fs");
            const path = "public/manifest.json";
            const manifest = JSON.parse(fs.readFileSync(path, "utf8"));
            manifest.version = process.argv[1];
            fs.writeFileSync(path, JSON.stringify(manifest, null, 2) + "\n");
          ' "${NEW_VERSION}"
          echo "version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${NEW_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build and package Chrome extension
        run: npm run package

      - name: Commit version bump and push tag
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json public/manifest.json
          git commit -m "chore: release ${{ steps.bump.outputs.tag }} [skip ci]"
          git tag "${{ steps.bump.outputs.tag }}"
          git push origin "HEAD:${{ github.ref_name }}" "${{ steps.bump.outputs.tag }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.bump.outputs.tag }}
          name: SafeHeader ${{ steps.bump.outputs.tag }}
          generate_release_notes: true
          files: |
            release/safeheader-v*.zip
            release/SHA256SUMS.txt
          body: |
            ## Install in Chrome
            1. Download `safeheader-v${{ steps.bump.outputs.version }}.zip` from the **Assets** below and unzip it into a folder.
            2. Open `chrome://extensions` in Chrome and enable **Developer mode** (top right).
            3. Click **Load unpacked** and select the unzipped folder (it contains `manifest.json` at the root).
