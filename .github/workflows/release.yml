name: Release Chrome Extension

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Bump version and update manifest
        id: bump
        shell: bash
        run: |
          npm version "${{ inputs.bump }}" --no-git-tag-version
          NEW_VERSION=$(node -p "require('./package.json').version")
          node -e '
            const fs = require("node:fs");
            const files = ["public/manifest.json", "public/manifest.firefox.json"];
            for (const path of files) {
              if (fs.existsSync(path)) {
                const manifest = JSON.parse(fs.readFileSync(path, "utf8"));
                manifest.version = process.argv[1];
                fs.writeFileSync(path, JSON.stringify(manifest, null, 2) + "\n");
              }
            }
          ' "${NEW_VERSION}"
          echo "version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${NEW_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build and package extension
        run: npm run package

      - name: Commit version bump and push tag
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json public/manifest.json public/manifest.firefox.json
          git commit -m "chore: release ${{ steps.bump.outputs.tag }} [skip ci]"
          git tag -f "${{ steps.bump.outputs.tag }}"
          git push origin "HEAD:${{ github.ref_name }}"
          git push origin "refs/tags/${{ steps.bump.outputs.tag }}" --force

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.bump.outputs.tag }}
          name: SafeHeader ${{ steps.bump.outputs.tag }}
          generate_release_notes: true
          files: |
            release/safeheader-v*.zip
            release/SHA256SUMS.txt
          body: |
            ## Install in Google Chrome / Chromium
            1. Download `safeheader-v${{ steps.bump.outputs.version }}-chrome.zip` from **Assets** below and unzip it.
            2. Navigate to `chrome://extensions` in Chrome and enable **Developer mode** (top right toggle).
            3. Click **Load unpacked** and select the unzipped directory.

            ## Install in Mozilla Firefox
            1. Download `safeheader-v${{ steps.bump.outputs.version }}-firefox.zip` from **Assets** below and unzip it.
            2. Navigate to `about:debugging#/runtime/this-firefox` in Firefox.
            3. Click **Load Temporary Add-on...** and select `manifest.json` inside the unzipped directory.
