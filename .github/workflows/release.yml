name: Release Chrome Extension

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Bump version and update manifest
        id: bump
        shell: bash
        run: |
          npm version "${{ inputs.bump }}" --no-git-tag-version
          NEW_VERSION=$(node -p "require('./package.json').version")
          node -e '
            const fs = require("node:fs");
            const files = ["public/manifest.json", "public/manifest.firefox.json"];
            for (const path of files) {
              if (fs.existsSync(path)) {
                const manifest = JSON.parse(fs.readFileSync(path, "utf8"));
                manifest.version = process.argv[1];
                fs.writeFileSync(path, JSON.stringify(manifest, null, 2) + "\n");
              }
            }
          ' "${NEW_VERSION}"
          echo "version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${NEW_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build and package extension
        run: npm run package

      - name: Commit version bump and push tag
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json public/manifest.json public/manifest.firefox.json
          git commit -m "chore: release ${{ steps.bump.outputs.tag }} [skip ci]"
          git tag -f "${{ steps.bump.outputs.tag }}"
          git push origin "HEAD:${{ github.ref_name }}"
          git push origin "refs/tags/${{ steps.bump.outputs.tag }}" --force

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.bump.outputs.tag }}
          name: SafeHeader ${{ steps.bump.outputs.tag }}
          generate_release_notes: true
          files: |
            release/safeheader-v*.zip
            release/SHA256SUMS.txt
          body: |
            ### Installation Instructions

            #### Google Chrome / Chromium (Edge, Brave, Arc, Opera)
            1. **Download the ZIP:** Download `safeheader-v${{ steps.bump.outputs.version }}-chrome.zip` from the **Assets** section below.
            2. **Extract the ZIP:** Extract / unzip the archive into a folder on your computer. Inside you will find `manifest.json` at the root.
            3. **Open Extensions Manager:** Open Chrome and navigate to `chrome://extensions` in the address bar.
            4. **Enable Developer Mode:** Turn **ON** the **Developer mode** toggle in the top-right corner.
            5. **Load Unpacked Extension:** Click the **Load unpacked** button in the top-left toolbar and select your extracted folder.
            6. **Pin & Use:** Pin SafeHeader from the extensions menu (puzzle-piece icon) or open it in the Side Panel.

            #### Mozilla Firefox
            1. **Download the ZIP:** Download `safeheader-v${{ steps.bump.outputs.version }}-firefox.zip` from the **Assets** section below.
            2. **Extract the ZIP:** Extract / unzip the archive to a local directory on your machine.
            3. **Open Debugging:** Open Firefox and navigate to `about:debugging#/runtime/this-firefox`.
            4. **Load Temporary Add-on:** Click **Load Temporary Add-on...** and select the `manifest.json` file inside the extracted directory.
            5. **Pin & Use:** Open SafeHeader from the toolbar or via the native Firefox Sidebar (`Cmd+B` / `Ctrl+B`).

            ---
            📖 **Live Documentation & Visual Guide:** https://rohithv16.github.io/safeheader/
