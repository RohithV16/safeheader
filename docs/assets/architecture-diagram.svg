<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="100%" height="auto">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b132b"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accentEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="960" height="380" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5"/>

  <!-- Subtle Grid lines -->
  <pattern id="archGrid" width="30" height="30" patternUnits="userSpaceOnUse">
    <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.8" opacity="0.6"/>
  </pattern>
  <rect width="960" height="380" rx="16" fill="url(#archGrid)"/>

  <!-- Stage 1: Browser Network Request -->
  <g transform="translate(40, 90)">
    <rect width="180" height="200" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
    <rect x="15" y="15" width="36" height="36" rx="8" fill="#0284c7" fill-opacity="0.2"/>
    <path d="M 33 24 L 33 42 M 24 33 L 42 33" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
    <text x="15" y="78" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="700" font-size="15">Browser Request</text>
    <text x="15" y="102" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">Document page load</text>
    <text x="15" y="120" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">fetch() / XHR API</text>
    <text x="15" y="138" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">Script / Asset / WS</text>
    <rect x="15" y="158" width="150" height="26" rx="6" fill="#0f172a" stroke="#1e293b"/>
    <text x="25" y="175" fill="#38bdf8" font-family="monospace" font-size="11">Origin: localhost:3000</text>
  </g>

  <!-- Arrow 1 to 2 -->
  <path d="M 225 190 L 265 190" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="4,4"/>
  <polygon points="265,185 275,190 265,195" fill="#38bdf8"/>

  <!-- Stage 2: SafeHeader Scope Guard Engine -->
  <g transform="translate(280, 50)">
    <rect width="250" height="280" rx="14" fill="#0b172e" stroke="#38bdf8" stroke-width="2" filter="url(#glowEffect)"/>
    <rect width="250" height="280" rx="14" fill="#0b172e" stroke="#38bdf8" stroke-width="1.5"/>
    <rect x="20" y="20" width="40" height="40" rx="8" fill="url(#cyanGrad)"/>
    <path d="M 40 28 L 50 32 V 42 C 50 48 45 52 40 54 C 35 52 30 48 30 42 V 32 Z" fill="#0f172a"/>
    <text x="70" y="38" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="800" font-size="16">SafeHeader Core</text>
    <text x="70" y="55" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600">Zero-Export &amp; Local Policy</text>

    <!-- Sub-cards inside SafeHeader -->
    <rect x="18" y="75" width="214" height="54" rx="8" fill="#111c38" stroke="#1e293b"/>
    <text x="28" y="96" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="700" font-size="13">Strict Scope Guard</text>
    <text x="28" y="115" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">Blocks wildcard (*) on credentials</text>

    <rect x="18" y="140" width="214" height="54" rx="8" fill="#111c38" stroke="#1e293b"/>
    <text x="28" y="161" fill="#818cf8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="700" font-size="13">DNR Rules Compiler</text>
    <text x="28" y="180" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">Priority allocation &amp; regex mapping</text>

    <rect x="18" y="205" width="214" height="54" rx="8" fill="#111c38" stroke="#1e293b"/>
    <text x="28" y="226" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="700" font-size="13">Audit Ring Buffer</text>
    <text x="28" y="245" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">Metadata-only 20-entry FIFO log</text>
  </g>

  <!-- Arrow 2 to 3 -->
  <path d="M 535 190 L 575 190" stroke="#818cf8" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="4,4"/>
  <polygon points="575,185 585,190 575,195" fill="#818cf8"/>

  <!-- Stage 3: Native Browser DeclarativeNetRequest Engine -->
  <g transform="translate(590, 75)">
    <rect width="200" height="230" rx="12" fill="url(#cardGrad)" stroke="#6366f1" stroke-width="1.5"/>
    <rect x="15" y="15" width="36" height="36" rx="8" fill="#4f46e5" fill-opacity="0.3"/>
    <circle cx="33" cy="33" r="10" stroke="#818cf8" stroke-width="2" fill="none"/>
    <text x="15" y="78" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="700" font-size="15">DNR Kernel Engine</text>
    <text x="15" y="98" fill="#818cf8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600">Chromium &amp; Firefox MV3</text>
    <text x="15" y="125" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">&bull; Zero JS latency in thread</text>
    <text x="15" y="145" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">&bull; Dynamic rules: max 30,000</text>
    <text x="15" y="165" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">&bull; Session rules: max 5,000</text>
    <text x="15" y="185" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">&bull; Native socket-level mod</text>
  </g>

  <!-- Arrow 3 to 4 -->
  <path d="M 795 190 L 835 190" stroke="#34d399" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="835,185 845,190 835,195" fill="#34d399"/>

  <!-- Stage 4: Wire Network Dispatch -->
  <g transform="translate(850, 90)">
    <rect width="70" height="200" rx="12" fill="url(#cardGrad)" stroke="#34d399" stroke-width="1.5"/>
    <text x="35" y="55" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="800" font-size="14" text-anchor="middle">WIRE</text>
    <text x="35" y="75" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="800" font-size="14" text-anchor="middle">NET</text>
    <line x1="15" y1="95" x2="55" y2="95" stroke="#334155" stroke-width="1.5"/>
    <text x="35" y="120" fill="#94a3b8" font-family="monospace" font-size="10" text-anchor="middle">TCP/IP</text>
    <text x="35" y="140" fill="#94a3b8" font-family="monospace" font-size="10" text-anchor="middle">TLS 1.3</text>
    <text x="35" y="160" fill="#94a3b8" font-family="monospace" font-size="10" text-anchor="middle">HTTP/2</text>
    <text x="35" y="180" fill="#94a3b8" font-family="monospace" font-size="10" text-anchor="middle">HTTP/3</text>
  </g>
</svg>
