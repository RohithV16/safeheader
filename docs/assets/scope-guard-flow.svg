<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" width="100%" height="auto">
  <defs>
    <linearGradient id="sgCardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="passGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="blockGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
  </defs>

  <rect width="880" height="320" rx="16" fill="#070a13" stroke="#334155" stroke-width="1.5"/>

  <!-- Step 1: Inbound Rule Definition -->
  <g transform="translate(30, 110)">
    <rect width="180" height="100" rx="10" fill="url(#sgCardGrad)" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="18" y="38" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="700" font-size="14">Rule Created</text>
    <text x="18" y="60" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">Header, Cookie, or</text>
    <text x="18" y="78" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">Query Parameter</text>
  </g>

  <path d="M 215 160 L 265 160" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,4"/>
  <polygon points="265,155 275,160 265,165" fill="#38bdf8"/>

  <!-- Decision 1: Is Sensitive? -->
  <g transform="translate(280, 80)">
    <polygon points="110,0 220,80 110,160 0,80" fill="#1e293b" stroke="#818cf8" stroke-width="1.5"/>
    <text x="110" y="70" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="700" font-size="13" text-anchor="middle">Is Sensitive</text>
    <text x="110" y="90" fill="#818cf8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="600" font-size="11" text-anchor="middle">Credential / Cookie?</text>
    <text x="110" y="110" fill="#94a3b8" font-family="monospace" font-size="10" text-anchor="middle">Auth, *token*, *key*</text>
  </g>

  <!-- Branch: NO -> Allowed directly -->
  <path d="M 390 80 L 390 40 L 680 40 L 680 95" stroke="#34d399" stroke-width="2" fill="none"/>
  <text x="430" y="32" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="700" font-size="11">NO (Standard Header)</text>
  <polygon points="675,95 680,105 685,95" fill="#34d399"/>

  <!-- Branch: YES -> Decision 2 -->
  <path d="M 505 160 L 545 160" stroke="#fbbf24" stroke-width="2"/>
  <polygon points="545,155 555,160 545,165" fill="#fbbf24"/>
  <text x="515" y="150" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="700" font-size="11">YES</text>

  <!-- Decision 2: Specific URL Filter Active? -->
  <g transform="translate(560, 110)">
    <rect width="160" height="100" rx="10" fill="url(#sgCardGrad)" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="16" y="35" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="700" font-size="13">URL Filter Check</text>
    <text x="16" y="58" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">Does profile have</text>
    <text x="16" y="74" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">specific domain filter?</text>
    <text x="16" y="90" fill="#38bdf8" font-family="monospace" font-size="10">*://*.corp.internal/*</text>
  </g>

  <!-- YES from Decision 2 -> Allowed -->
  <path d="M 725 140 L 760 140" stroke="#34d399" stroke-width="2"/>
  <polygon points="760,135 770,140 760,145" fill="#34d399"/>
  <text x="735" y="132" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="700" font-size="11">YES</text>

  <!-- Output 1: ALLOWED -->
  <g transform="translate(775, 110)">
    <rect width="80" height="50" rx="8" fill="url(#passGrad)"/>
    <text x="40" y="31" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="800" font-size="12" text-anchor="middle">ACTIVE</text>
  </g>

  <!-- NO from Decision 2 -> BLOCKED -->
  <path d="M 640 215 L 640 260 L 760 260" stroke="#ef4444" stroke-width="2" fill="none"/>
  <polygon points="760,255 770,260 760,265" fill="#ef4444"/>
  <text x="660" y="252" fill="#ef4444" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="700" font-size="11">NO (Wildcard *)</text>

  <!-- Output 2: BLOCKED / QUARANTINED -->
  <g transform="translate(775, 235)">
    <rect width="80" height="50" rx="8" fill="url(#blockGrad)"/>
    <text x="40" y="31" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="800" font-size="12" text-anchor="middle">BLOCKED</text>
  </g>
</svg>
